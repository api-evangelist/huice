name: Huice
description: 'Huice (慧策) is a Chinese enterprise software company whose flagship product, Wangdiantong
  (旺店通) ERP, is a tailor-made e-commerce management system for merchants operating across multiple
  online channels. It provides order management, warehouse and inventory management (WMS), goods and
  product-archive management, procurement, after-sales/returns processing, and financial operations
  (慧经营). Huice runs a public Open Platform (open.wangdian.cn) exposing an HTTP API (openapi2) for
  third-party integrators to synchronize shops, goods, orders, stock, purchasing, and logistics. The
  API uses a sid + appkey + timestamp + MD5 signature (sign) authentication scheme, page_no/page_size
  pagination, and a code/message response envelope, with separate sandbox and production hosts.'
