apis:
- name: Wangdiantong Open Platform API
  description: 'The Wangdiantong (旺店通) ERP Open Platform HTTP API (openapi2). Endpoints are named
    PHP methods (e.g. trade_push.php, trade_query.php, goods_push.php, stock_query.php) grouped into
    basics (shops/warehouses/logistics/suppliers), goods, orders, after-sales, procurement, and
    inventory. Authentication is via sid + appkey + timestamp + MD5 sign; pagination via
    page_no/page_size; responses return code (0 = success) and message.'
